<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#5c54d4"/>
  
  <!-- Clock face -->
  <circle cx="16" cy="16" r="11" fill="white" opacity="0.95"/>
  
  <!-- Hour markers -->
  <line x1="16" y1="6.5" x2="16" y2="8.5" stroke="#5c54d4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="23.5" x2="16" y2="25.5" stroke="#5c54d4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6.5" y1="16" x2="8.5" y2="16" stroke="#5c54d4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23.5" y1="16" x2="25.5" y2="16" stroke="#5c54d4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Minor markers -->
  <line x1="21.2" y1="8.1" x2="20.3" y2="9.6" stroke="#5c54d4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="23.9" y1="10.8" x2="22.4" y2="11.7" stroke="#5c54d4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="23.9" y1="21.2" x2="22.4" y2="20.3" stroke="#5c54d4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="21.2" y1="23.9" x2="20.3" y2="22.4" stroke="#5c54d4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="10.8" y1="23.9" x2="11.7" y2="22.4" stroke="#5c54d4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="8.1" y1="21.2" x2="9.6" y2="20.3" stroke="#5c54d4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="8.1" y1="10.8" x2="9.6" y2="11.7" stroke="#5c54d4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="10.8" y1="8.1" x2="11.7" y2="9.6" stroke="#5c54d4" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Hour hand — pointing to ~10 -->
  <line x1="16" y1="16" x2="11.5" y2="11.2" stroke="#3c3489" stroke-width="2" stroke-linecap="round"/>

  <!-- Minute hand — pointing to ~12 -->
  <line x1="16" y1="16" x2="16" y2="8.5" stroke="#3c3489" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="#3c3489"/>
</svg>
